<!-- Every box and every line in the diagram is focusable, which is what makes it
     usable from a keyboard and also what puts forty tab stops between the header
     and the panel that explains them. -->
<a class="skip" href="#insp">Skip to the details panel</a>
<header>
  <div class="hrow">
    <!-- Every project page is built to site/<id>/, so the index over them is one level
         up. A relative href, because the site is served from a repository path on Pages
         and from the filesystem locally, and neither can assume the other's origin. -->
    <a class="home" href="../" title="All architectures">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M9.8 3.5 5.3 8l4.5 4.5"/></svg>
    </a>
    <div class="brand" id="brand"></div>
    <!-- Phone-only, hidden by CSS elsewhere: Fit stays in reach because it is the
         recovery gesture after a pinch, and everything else goes behind the menu. -->
    <div class="hbtns">
      <button class="btn ico line fitm canvas-only" id="fitm" type="button"
        title="Fit to view" aria-label="Fit to view">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H2.8a.8.8 0 0 0-.8.8V6"/><path d="M10 2h3.2a.8.8 0 0 1 .8.8V6"/><path d="M14 10v3.2a.8.8 0 0 1-.8.8H10"/><path d="M6 14H2.8a.8.8 0 0 1-.8-.8V10"/></svg>
      </button>
      <button class="btn ico line menubtn" id="menubtn" type="button" aria-expanded="false"
        aria-controls="ctrls" aria-label="Display and export options" title="Display and export options">
      <svg class="i-menu" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4h12"/><path d="M2 8h12"/><path d="M2 12h12"/></svg>
      <svg class="i-close" viewBox="0 0 16 16" aria-hidden="true"><path d="m4.4 4.4 7.2 7.2"/><path d="m11.6 4.4-7.2 7.2"/></svg>
      </button>
    </div>
    <div class="spacer"></div>
    <div class="stagepick" role="group" aria-label="Deployment stage"><span class="eyebrow">Stage</span><div id="stages"></div></div>
    <div class="ctrls" id="ctrls">
      <!-- Three groups, because these are three kinds of thing: what the diagram shows,
           how it is framed, and what you take away. Segmented like the stage picker so
           the whole header speaks one language. -->
      <div class="seg" role="group" aria-label="Display">
        <button class="btn ico" id="icontoggle" type="button" aria-pressed="false">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="1.5" width="5.5" height="5.5" rx="1.4"/><rect x="9" y="1.5" width="5.5" height="5.5" rx="1.4"/><rect x="1.5" y="9" width="5.5" height="5.5" rx="1.4"/><rect x="9" y="9" width="5.5" height="5.5" rx="1.4"/></svg>
        </button>
        <button class="btn ico" id="themetoggle" type="button"></button>
      </div>
      <div class="seg canvas-only" role="group" aria-label="Zoom">
        <button class="btn" id="zout" title="Zoom out (-)" aria-label="Zoom out">&minus;</button>
        <span class="zoomval mono" id="zval">100%</span>
        <button class="btn" id="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <button class="btn ico line" id="zfit" title="Fit to view (0)" aria-label="Fit to view">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 2H2.8a.8.8 0 0 0-.8.8V6"/><path d="M10 2h3.2a.8.8 0 0 1 .8.8V6"/><path d="M14 10v3.2a.8.8 0 0 1-.8.8H10"/><path d="M6 14H2.8a.8.8 0 0 1-.8-.8V10"/></svg>
        </button>
      </div>
      <div class="seg canvas-only" role="group" aria-label="Export">
        <button class="btn ico line" id="savepng" type="button"
          title="Download this diagram as a PNG" aria-label="Download this diagram as a PNG">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8v7.6"/><path d="M4.9 6.4 8 9.5l3.1-3.1"/><path d="M2.4 11.3v1.6a1.3 1.3 0 0 0 1.3 1.3h8.6a1.3 1.3 0 0 0 1.3-1.3v-1.6"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="tabs" role="tablist" id="tabs"></div>
</header>

<main class="shell">
  <div class="stage" id="stage" role="tabpanel">
    <svg id="svg" role="group"><g id="root"></g></svg>
    <div class="doc" id="doc" hidden></div>
    <div id="tables" hidden></div>
    <div class="hint mono" id="hint">
      <span>drag to pan</span><span>scroll to zoom</span><span>click a box or a line</span><span>esc to clear</span>
    </div>
  </div>
  <aside>
    <!-- Phone-only handle. On a phone the panel is a bottom sheet; this is what
         peeks above the fold and what a reader drags or taps to open it. -->
    <button class="sheetgrip" id="sheetgrip" type="button" aria-expanded="false" aria-controls="insp">
      <span class="grip-bar" aria-hidden="true"></span>
      <span class="grip-label" id="griplabel">Details</span>
    </button>
    <!-- Shown only where the panel collapses. Its containing block differs by shape: in
         portrait the sheet is fixed and so positions it, in landscape the panel scrolls
         and the shell positions it instead — which is what keeps it from scrolling away. -->
    <button class="panelclose" id="panelclose" type="button" aria-label="Close the details panel"
      title="Close the details panel">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4.4 4.4 7.2 7.2"/><path d="m11.6 4.4-7.2 7.2"/></svg>
    </button>
    <div id="viewhdr"></div>
    <div id="insp" tabindex="-1"></div>
    <!-- Says what changed, in one line. The panel itself is no longer a live
         region: announcing all 537 characters of it on every click is not help. -->
    <p class="sr-only" id="status" role="status"></p>
  </aside>
</main>
