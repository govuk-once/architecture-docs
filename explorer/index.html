<main>
  <div class="masthead">
    <div><!--MASTHEAD--></div>
    <div class="spacer"></div>
    <button class="mono" id="themetoggle" type="button"></button>
  </div>

  <div class="grid"><!--CARDS--></div>
</main>

<footer><!--FOOTER--></footer>

<script>
  /*
   * Everything above is static HTML written by the build: the index is the site's front
   * door and should say what it says with no script at all. The only script is the theme
   * toggle, and it degrades to the system theme without it.
   *
   * The theme choice is the reader's and this is one site, so it is stored under one key
   * every page here shares — pick dark here and a project page opens dark. The three
   * states and the key match the explorer's own toggle exactly; see app.js.
   */
  (function () {
    var THEMES = [
      {
        id: "system",
        label: "Match system",
        d: '<rect x="2" y="3" width="12" height="8" rx="1.5"/><path d="M6 14h4M8 11v3"/>',
      },
      {
        id: "light",
        label: "Light",
        d: '<circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3.1 3.1l1.1 1.1M11.8 11.8l1.1 1.1M12.9 3.1l-1.1 1.1M4.2 11.8l-1.1 1.1"/>',
      },
      {
        id: "dark",
        label: "Dark",
        d: '<path d="M13.5 9.6A5.8 5.8 0 0 1 6.4 2.5a5.9 5.9 0 1 0 7.1 7.1Z"/>',
      },
    ];
    var btn = document.getElementById("themetoggle");
    var stored = null;
    try {
      stored = localStorage.getItem(THEME_KEY);
    } catch (e) {
      /* private mode */
    }
    var i = 0;
    for (var n = 0; n < THEMES.length; n++) if (THEMES[n].id === stored) i = n;
    function paint() {
      var t = THEMES[i];
      if (t.id === "system")
        document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", t.id);
      btn.innerHTML =
        '<svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">' +
        t.d +
        "</svg>" +
        t.label;
      btn.setAttribute("aria-label", "Theme: " + t.label + ". Click to change.");
    }
    paint();
    btn.addEventListener("click", function () {
      i = (i + 1) % THEMES.length;
      paint();
      try {
        localStorage.setItem(THEME_KEY, THEMES[i].id);
      } catch (e) {
        /* private mode */
      }
    });
  })();
</script>
