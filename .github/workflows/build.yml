name: Build and publish

# Every architecture here is derived from its own source repository, so every run checks
# those out beside this one and rebuilds from them. That is also the drift check: each
# project's derived/architecture-facts.json is committed, so if a rebuild changes one, something
# moved over there and these docs have not caught up yet.
#
# Adding a project means adding its checkout step below, next to the others. That is the
# one manual step: a workflow cannot loop `actions/checkout`, and a project may be private
# and need its own token, so the steps are written out rather than generated.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nothing here changes when a documented repository changes, so a scheduled run is the
  # only thing that notices a route, domain or alarm added over there.
  schedule:
    - cron: "17 7 * * 1-5"
  # A manual run can publish whatever branch it is started from. There is one Pages site
  # per repository, so this replaces what is live until the next push to main rebuilds it —
  # which is the point on a branch nobody can review yet, and a footgun otherwise. It is
  # opt-in per run for that reason.
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publish this build to GitHub Pages (replaces the live site)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Each project's ref, matching the `ref` of each source in its project.config.json.
  FLEX_REF: main
  # All four of the GOV.UK App's sources track main.
  APP_REF: main
  UDP_REF: main
  UNS_REF: main
  CHAT_REF: main

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the docs
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      # One step per project, each checked out to exactly where that project's
      # `source.root` points, so CI and a local `pnpm sync` put it in the same place and
      # nothing has a second opinion. `pnpm build` fails naming the project and the path
      # if one of these is missing.
      #
      # FLEX is public, so no token is needed. A private one needs a token with
      # Contents: read on it — the default GITHUB_TOKEN is scoped to this repository alone
      # and cannot read another.
      - name: Checkout FLEX
        uses: actions/checkout@v5
        with:
          repository: govuk-once/flex
          ref: ${{ env.FLEX_REF }}
          path: .sources/flex
          persist-credentials: false

      # The GOV.UK App is read from four repositories, one step each, to the roots its
      # `sources` name. All four are public. None is installed: nothing synthesises from
      # them — two are Swift and Kotlin, and the backend's SAM templates are read as written.
      - name: Checkout the GOV.UK App · iOS
        uses: actions/checkout@v5
        with:
          repository: govuk-once/govuk-mobile-ios-app
          ref: ${{ env.APP_REF }}
          path: .sources/app/ios
          persist-credentials: false

      - name: Checkout the GOV.UK App · Android
        uses: actions/checkout@v5
        with:
          repository: govuk-once/govuk-mobile-android-app
          ref: ${{ env.APP_REF }}
          path: .sources/app/android
          persist-credentials: false

      - name: Checkout the GOV.UK App · backend
        uses: actions/checkout@v5
        with:
          repository: alphagov/govuk-mobile-backend
          ref: ${{ env.APP_REF }}
          path: .sources/app/backend
          persist-credentials: false

      - name: Checkout the GOV.UK App · remote config
        uses: actions/checkout@v5
        with:
          repository: alphagov/govuk-mobile-backend-config
          ref: ${{ env.APP_REF }}
          path: .sources/app/config
          persist-credentials: false

      # GovKit is the shared Swift library the iOS app depends on, so a change there can
      # falsify a claim this page makes about iOS. Read, never installed.
      - name: Checkout the GOV.UK App · GovKit
        uses: actions/checkout@v5
        with:
          repository: govuk-once/govuk-mobile-ios-gov-kit
          ref: ${{ env.APP_REF }}
          path: .sources/app/govkit
          persist-credentials: false

      - name: Checkout UDP
        uses: actions/checkout@v5
        with:
          repository: govuk-once/user-data-platform
          ref: ${{ env.UDP_REF }}
          path: .sources/udp
          persist-credentials: false

      # UNS is read and never installed or synthesised: its CDK app imports a package
      # whose source is public and builds cleanly, but which is published only to a
      # private CodeArtifact registry — so its counts are prose rather than derived.
      # Publishing that package, or a read role for the registry, is the whole of what a
      # `synth` block needs: with it resolved, the app synthesises here without credentials.
      - name: Checkout UNS
        uses: actions/checkout@v5
        with:
          repository: govuk-once/gds-unified-notification-service
          ref: ${{ env.UNS_REF }}
          path: .sources/uns
          persist-credentials: false

      # GOV.UK Chat is read and never installed or synthesised: its CDK app bundles every
      # Lambda in Docker against a private git dependency, so only its own CI can synth it.
      - name: Checkout GOV.UK Chat
        uses: actions/checkout@v5
        with:
          repository: govuk-once/govuk-chat-v2
          ref: ${{ env.CHAT_REF }}
          path: .sources/chat
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # `pnpm synth` runs each project's CDK app inside its checkout, so the checkout needs
      # its own dependencies resolvable. A project with no `synth` block needs no step here.
      - name: Install FLEX dependencies
        working-directory: .sources/flex
        run: pnpm install --frozen-lockfile --ignore-scripts

      # UDP's CDK app loads every function from a build directory its own script writes,
      # so `pnpm synth` runs that build first (`synth.prepare` in its config); the install
      # here is what that build and the app need.
      - name: Install UDP dependencies
        working-directory: .sources/udp
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The one step that executes a documented repository: each project's CDK app is run
      # per stage to produce the CloudFormation the counts are read from. No credentials —
      # a context lookup this runner cannot make becomes a dummy value, which is right for
      # counting resources by type. What runs is exactly `synth.command` in each project's
      # config; see scripts/synthSource.ts.
      - name: Synthesise the CloudFormation the counts are read from
        run: pnpm synth

      # Before the build, because the build advances each recorded commit as soon as it
      # re-derives — run afterwards this would compare every checkout against itself and
      # always report that nothing had moved.
      #
      # The facts gate below only covers the derived counts and the alarms. Everything
      # else in the explorer is prose written by reading the code, and a rewritten CDK
      # stack moves no number here at all. So this lists which of the files the docs cite
      # changed since the commit they were built from: a reading list, never a gate.
      - name: Report what moved that these docs cite
        continue-on-error: true
        run: pnpm drift

      # Locally the facts step reuses its last result when nothing it reads has moved.
      # Here it never does: deriving them again and diffing is the entire point of the
      # run, so `pnpm facts` sees CI is set and re-reads every config.
      - name: Build
        run: pnpm build

      # Every project's facts are committed, so a change over there is a reviewable diff
      # here. If this fails on a scheduled run, a source moved; if it fails on a pull
      # request, someone changed a model without rebuilding.
      #
      # derived/architecture-source.json is deliberately not part of this gate, and the build has
      # just rewritten it with this run's commit. It records which source commit the facts
      # came from, and it changes on every commit over there — including the great
      # majority that change nothing here. Gating on it would fail this job constantly,
      # which is the same as it never failing at all.
      - name: Check the committed facts are up to date
        run: |
          if ! git diff --exit-code --stat -- 'projects/*/derived/architecture-facts.json'; then
            echo "::error::Derived facts are out of date. Run 'pnpm build' and commit the result."
            exit 1
          fi

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Render checks
        run: pnpm check

      - name: Lint, typecheck and test
        run: |
          pnpm lint
          pnpm tsc
          pnpm test --run

      # The site as built, plain. The deploy job takes it from here, and so does the
      # Confluence workflow; on a pull request it is the thing to download and open. What
      # gets published may be sealed behind a password — that happens in the deploy job,
      # which is the one bound to the environment holding the password.
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 14

  # A push to main always publishes. Any other run publishes only when asked, and a
  # scheduled run never does: it is a drift check, and a drifted build fails before it
  # gets here anyway.
  #
  # If the github-pages environment holds a SITE_PASSWORD, every page is sealed behind it
  # before it is uploaded: what Pages serves is a small page that asks for the password
  # and decrypts the real one in the browser. With no secret set the site publishes as it
  # is. The secret lives on the environment, which is why the sealing happens here and not
  # in the build — the build job cannot see it, and should not.
  deploy:
    name: Deploy to Pages
    needs: build
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout the docs
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site

      - name: Seal it behind the password, if one is set
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: pnpm encrypt-site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4

  # A scheduled run is the only thing that notices a documented repository moving between
  # one manual run and the next, and a scheduled run that fails is invisible: no pull
  # request shows it, and nobody is watching the Actions tab on a Tuesday. This one failed
  # every day for a week — `Input required and not supplied: token`, from a checkout step
  # that still wanted a secret for a repository that had since gone public — and the first
  # anyone knew of it was somebody going to look. Silence is the failure mode; an issue is
  # the fix, because an issue is the one thing in a repository that stays until answered.
  report-schedule:
    name: Report the scheduled run
    needs: build
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the alarm
        env:
          GH_TOKEN: ${{ github.token }}
          # This job checks nothing out, so gh has no git remote to infer a repository
          # from and dies on its first call. Naming the repository is the whole fix. It
          # failed this way silently for two days, behind a continue-on-error that has
          # been removed: an alarm that cannot raise itself has to fail loudly instead.
          GH_REPO: ${{ github.repository }}
          OUTCOME: ${{ needs.build.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          title='Scheduled build is failing'
          # Matched on title rather than a label, because a label has to exist first and a
          # missing one would fail the very step meant to raise the alarm.
          number=$(gh issue list --state open --limit 50 --json number,title \
            --jq ".[] | select(.title == \"$title\") | .number" | head -1)

          if [ "$OUTCOME" = 'success' ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --body "Fixed: the scheduled build passed again. $RUN_URL"
              gh issue close "$number"
              echo "closed #$number — the scheduled build is green again"
            else
              echo "scheduled build green, nothing to close"
            fi
            exit 0
          fi

          body=$(printf '%s\n' \
            "The scheduled build failed: $RUN_URL" \
            "" \
            "This run is the only thing that notices a documented repository changing" \
            "between manual runs. While it is failing, the diagrams can drift and nothing" \
            "here will say so — the site keeps serving whatever was published last." \
            "" \
            "This issue is updated on each further failure and closed automatically when a" \
            "scheduled run passes again.")

          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$body"
            echo "commented on #$number"
          else
            gh issue create --title "$title" --body "$body"
            echo "opened a new alarm issue"
          fi
